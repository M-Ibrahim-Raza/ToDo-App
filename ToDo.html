<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo</title>
  <link rel="stylesheet" href="ToDo.css">
</head>


<body>
 
  <header></header>

  <main>

    <h1>ToDo</h1>
    
    <div id="Input-Section">

      <input id="To-Do-Input" type="text" maxlength="100" placeholder="Enter Details Here ( Maximum 100 Characters)">
    
      <input id="Date-Input" type="date">
      
      <button id="Submit-Button" onclick="
      SubmitToDo();
      ">Submit</button>

    </div>
    
    <h3>
      <span id="Task-Heading">Task</span>
      <span >Date</span>
    </h3>
    
    <div id="To-Do-Display-Section"></div>

  </main>

  <footer></footer>

  <script src="ToDo.js"></script>
</body>
</html>
